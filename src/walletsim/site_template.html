<title>Wallet Archive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: a museum-catalogue shell. A sticky top bar (wordmark, Discover / Artists / Years, search, grid), then one view at a time:
   a central timeline with the active designer's wallets either side of the axis, or a wallet's detail with Overview / Materials & Source / Behaviour.
   Colour: white and light grey ground, near-black ink, one blue for "where you are", amber only for "not recorded". */
:root {
  --bg: #fafaf9; --surface: #ffffff; --fg: #161616; --muted: #6b6b6b; --faint: #a9a9a9; --line: #e5e5e3; --axis: #cfcfcc;
  --blue: #1d5ba1; --blue-soft: #dbe7f5; --amber: #b25f00; --amber-soft: #fbefdc; --plate: #f1f1ef; --ink: #2a2a2a;
  --accent: #b3261e; --ink2: #1d5ba1; --zone: #f6e3e1; --grid: #e6e6e4; --ok: #2d6a3e; --okbg: #e8f1ea;
  --shadow: 0 1px 14px rgba(0, 0, 0, .06);
  --body: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111111; --surface: #181818; --fg: #ececea; --muted: #9b9b98; --faint: #5f5f5d; --line: #2c2c2a; --axis: #3d3d3a;
  --blue: #7fb0ea; --blue-soft: #1d2e44; --amber: #e8b05c; --amber-soft: #33281a; --plate: #1f1f1d; --ink: #d9d9d6;
  --accent: #ef6a60; --ink2: #7fb0ea; --zone: #3a1f1d; --grid: #262624; --ok: #7fc293; --okbg: #1c2e22;
  --shadow: 0 1px 14px rgba(0, 0, 0, .4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111111; --surface: #181818; --fg: #ececea; --muted: #9b9b98; --faint: #5f5f5d; --line: #2c2c2a; --axis: #3d3d3a;
  --blue: #7fb0ea; --blue-soft: #1d2e44; --amber: #e8b05c; --amber-soft: #33281a; --plate: #1f1f1d; --ink: #d9d9d6;
  --accent: #ef6a60; --ink2: #7fb0ea; --zone: #3a1f1d; --grid: #262624; --ok: #7fc293; --okbg: #1c2e22;
  --shadow: 0 1px 14px rgba(0, 0, 0, .4); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.5; font-weight: 400; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { margin: 0; font-weight: 300; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: clamp(1.8rem, 4.6vw, 2.9rem); line-height: 1.1; } h2 { font-size: clamp(1.5rem, 3.4vw, 2.1rem); line-height: 1.15; } h3 { font-size: 1.05rem; font-weight: 500; letter-spacing: 0; }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.muted { color: var(--muted); } .small { font-size: .84rem; } .tnum { font-variant-numeric: tabular-nums; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); box-shadow: var(--shadow); }
.bar-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 12px 34px; flex-wrap: wrap; min-height: 64px; padding-block: 6px; }
.brand { font-size: 1.35rem; font-weight: 300; letter-spacing: .02em; white-space: nowrap; } .brand .b2 { color: var(--muted); }
.tabs { display: flex; gap: 6px; } .tabs a { padding: 20px 8px 17px; font-size: .98rem; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); } .tabs a:hover { color: var(--fg); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 14px; position: relative; }
.search { display: flex; align-items: center; gap: 8px; background: var(--plate); border-radius: 8px; padding: 0 12px; height: 38px; width: min(300px, 62vw); }
.search svg { flex: none; color: var(--muted); } .search input { all: unset; flex: 1; min-width: 0; font-size: .95rem; color: var(--fg); } .search input::placeholder { color: var(--muted); }
.gridbtn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; color: var(--muted); } .gridbtn:hover, .gridbtn[aria-current="page"] { background: var(--plate); color: var(--fg); }
.results { position: absolute; top: 46px; right: 52px; width: min(360px, 88vw); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; z-index: 40; }
.results a { display: grid; gap: 1px; padding: 8px 10px; border-radius: 6px; } .results a:hover, .results a:focus-visible { background: var(--plate); } .results .none { padding: 10px; color: var(--muted); font-size: .9rem; }

main { max-width: 1280px; margin: 0 auto; padding-top: 28px; min-width: 0; }
.foot { max-width: 1280px; margin: 56px auto 0; color: var(--muted); font-size: .8rem; display: grid; gap: 4px; }

/* provenance chips */
.chip { display: inline-block; font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--axis); color: var(--muted); white-space: nowrap; vertical-align: 1px; }
.chip.measured { background: var(--fg); color: var(--bg); border-color: var(--fg); } .chip.reported { border-color: var(--muted); color: var(--fg); }
.chip.inferred { border-style: dashed; border-color: var(--muted); color: var(--fg); } .chip.assumed { border-color: var(--amber); color: var(--amber); }
.chip.model { border-color: var(--blue); color: var(--blue); }
.unk { color: var(--amber); font-size: .9rem; }

/* discover: the central timeline */
.timeline { display: grid; position: relative; min-height: min(560px, calc(100vh - 230px)); align-content: start; }
.timeline::before { content: ""; position: absolute; left: calc(50% - .5px); top: -28px; bottom: 0; width: 1px; background: var(--axis); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 360px minmax(0, 1fr); align-items: center; min-height: 74px; }
.row .mid { display: grid; grid-template-columns: 1fr 26px 1fr; align-items: center; align-self: stretch; position: relative; text-align: left; background: none; border: 0; padding: 0; width: 100%; color: inherit; }
.row .yr { text-align: right; padding-right: 10px; font-size: 1.05rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.row .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--axis); justify-self: center; position: relative; z-index: 1; box-shadow: 0 0 0 5px var(--bg); }
.row .who { padding-left: 12px; color: var(--faint); display: grid; gap: 0; }
.row .who b { font-weight: 500; font-size: 1.05rem; } .row .who span { font-size: .95rem; }
.row .mid:hover .who, .row .mid:hover .yr { color: var(--muted); }
.row.active { min-height: 300px; }
.row.active .yr { color: var(--blue); } .row.active .dot { background: var(--blue); box-shadow: 0 0 0 5px var(--blue-soft); } .row.active .dot.undated { background: var(--amber); box-shadow: 0 0 0 5px var(--amber-soft); }
.row.active .yr.undated { color: var(--amber); } .row.active .who { color: var(--fg); }
.row .side { display: flex; gap: 22px; align-items: flex-start; min-width: 0; padding-block: 10px; }
.row .side.left { justify-content: flex-end; padding-right: 26px; } .row .side.right { justify-content: flex-start; padding-left: 26px; }
.row:not(.active) .side { display: none; }
.row .side { position: relative; } .row .side.paged { padding-inline: 46px; }
.pager { position: absolute; top: 52px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.pager[data-dir="-1"] { left: 0; } .pager[data-dir="1"] { right: 0; } .pager[disabled] { opacity: .35; cursor: default; }
.card { display: grid; gap: 10px; flex: 0 1 clamp(140px, 14vw, 230px); min-width: 0; align-content: start; } .card .plate { border-radius: 6px; }
.plate { background: var(--plate); aspect-ratio: 3 / 2; display: grid; place-items: center; overflow: hidden; border-radius: 6px; } .plate svg, .plate img { max-width: 100%; max-height: 100%; display: block; }
.card .cap { display: grid; gap: 1px; font-size: .95rem; } .card .cap .series { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); } .card .cap .st { font-size: .8rem; color: var(--muted); }
.card:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
.bio { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin: 4px auto 14px; max-width: 640px; display: grid; gap: 6px; font-size: .92rem; }
.biobtn { background: none; border: 1px solid var(--line); border-radius: 6px; font-size: .78rem; padding: 2px 10px; margin-top: 4px; justify-self: start; color: var(--muted); } .biobtn:hover { color: var(--fg); border-color: var(--muted); }
.hint { text-align: center; color: var(--muted); font-size: .86rem; margin-top: 18px; }

/* lists and grid */
.page-h { display: grid; gap: 6px; margin-bottom: 26px; }
.list { display: grid; border-top: 1px solid var(--line); } .list > * { border-bottom: 1px solid var(--line); }
.item { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr) auto; gap: 8px 24px; padding: 18px 2px; align-items: baseline; }
.item .links { display: flex; flex-wrap: wrap; gap: 4px 18px; } .item .links a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--axis); }
.item .count { color: var(--muted); font-size: .88rem; }
.allgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 30px 24px; } .allgrid .card { flex: none; }

/* wallet detail */
.crumb { font-size: .86rem; color: var(--muted); display: inline-flex; gap: 6px; margin-bottom: 18px; } .crumb:hover { color: var(--fg); }
.whead { display: grid; gap: 8px; margin-bottom: 22px; }
.wtabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 30px; overflow-x: auto; }
.wtabs a { padding: 10px 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; } .wtabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 6px; padding: 11px 15px; font-size: .9rem; max-width: 86ch; margin-bottom: 26px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: start; } .two > * { min-width: 0; }
.hero { aspect-ratio: 2 / 1; } .caption { color: var(--muted); font-size: .8rem; margin-top: 8px; }
dl.facts { margin: 0; display: grid; } .fact { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.fact dt { color: var(--muted); font-size: .88rem; } .fact dd { margin: 0; display: grid; gap: 3px; } .fact .ref { color: var(--muted); font-size: .8rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sect { display: grid; gap: 14px; margin-top: 44px; min-width: 0; } .sect > p { margin: 0; max-width: 72ch; }
.srcbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--plate); max-width: 520px; } .srcbar i { display: block; height: 100%; }
.srcbar .measured { background: var(--fg); } .srcbar .reported { background: var(--muted); } .srcbar .inferred { background: var(--faint); } .srcbar .literature, .srcbar .design { background: var(--axis); } .srcbar .assumed { background: var(--amber); }
.srckey { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .84rem; color: var(--muted); }
ul.plain { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: .92rem; }

/* materials and source */
.process { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; position: relative; margin: 8px 0 12px; }
.process::before { content: ""; position: absolute; left: 24px; right: 0; top: 17px; height: 1px; background: var(--axis); }
.step { display: grid; gap: 6px; justify-items: start; position: relative; padding-right: 14px; }
.step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: .92rem; } .step .n.unknown { background: var(--surface); color: var(--amber); border: 1px dashed var(--amber); }
.step .lab { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; } .step .val { font-size: .92rem; } .step .ref { color: var(--muted); font-size: .78rem; }
.sources { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px 40px; align-items: center; margin-top: 8px; }
.matrix { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 0 28px; align-items: center; }
.comps { display: grid; min-width: 0; }
.comp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(50px, 130px) minmax(0, 560px); align-items: center; gap: 0 6px; padding: 18px 0; border-top: 1px solid var(--line); }
.curve { width: 100%; height: 90px; display: block; overflow: visible; } .curve path { fill: none; stroke: var(--faint); stroke-width: 1.4; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; } .curve circle { fill: var(--ink); }
.matrix { grid-template-columns: minmax(0, 280px) minmax(0, 1fr) !important; align-items: start; }
.matrix .plate { aspect-ratio: 4 / 3; }
.comp .link { height: 0; border-top: 1px dotted var(--faint); }
.comp .tilecap { display: grid; gap: 2px; font-size: .9rem; } .comp .tilecap .reg { color: var(--amber); font-size: .8rem; } .comp .tilecap .reg.known { color: var(--fg); }
.hide { width: 100%; background: var(--plate); border-radius: 6px; padding: 8px; } .hide svg { display: block; width: 100%; height: auto; }
.hide .body { fill: var(--surface); stroke: var(--faint); stroke-width: 1.2; } .hide .div { stroke: var(--faint); stroke-width: .8; stroke-dasharray: 2 3; }
.hide .rl { fill: var(--faint); font: 7.5px var(--body); letter-spacing: .06em; text-transform: uppercase; } .hide .zone { fill: var(--blue); opacity: .28; }
.cmp { display: grid; gap: 12px; } .sect > * { min-width: 0; } .cmp select { width: 100%; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; } th { font-weight: 500; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); } tr:last-child td { border-bottom: 0; }

/* behaviour */
.chartwrap { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 8px; overflow-x: auto; }
.chart { width: 100%; min-width: 620px; height: auto; display: block; }
.chart .zone { fill: var(--zone); } .chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .tick, .chart .rowsub, .chart .axis, .chart .end { fill: var(--muted); font: 11.5px var(--body); } .chart .zonelabel { fill: var(--accent); font: 600 11.5px var(--body); }
.chart .rowname { fill: var(--fg); font: 600 14px var(--body); } .chart .val { fill: var(--fg); font: 600 12.5px var(--body); font-variant-numeric: tabular-nums; }
.chart .femval { fill: var(--ink2); font: 600 12px var(--body); font-variant-numeric: tabular-nums; } .chart .range { stroke: var(--accent); stroke-width: 3; opacity: .45; stroke-linecap: round; }
.chart .rec { fill: var(--accent); } .chart .fem { fill: var(--ink2); } .chart .fem.hollow { fill: var(--surface); stroke: var(--ink2); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: .82rem; color: var(--muted); padding: 4px 4px 10px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 7px; vertical-align: -1px; }
.legend .l1::before { background: var(--accent); border-radius: 50%; } .legend .l2::before { background: var(--accent); opacity: .45; height: 4px; vertical-align: 3px; width: 20px; border-radius: 2px; }
.legend .l3::before { background: var(--ink2); transform: rotate(45deg) scale(.8); } .legend .l4::before { border: 2px solid var(--ink2); transform: rotate(45deg) scale(.7); }
.frame { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: block; min-height: 700px; }
.pill { display: inline-block; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; padding: 1px 8px; border-radius: 99px; background: var(--plate); color: var(--muted); white-space: nowrap; }
.pill.computed { background: var(--blue-soft); color: var(--blue); } .pill.flagged, .pill.unknown { background: var(--amber-soft); color: var(--amber); } .pill.not-triggered { background: var(--okbg); color: var(--ok); }
.fm td:nth-child(1) { color: var(--muted); } .fm td:nth-child(4) { min-width: 300px; }
.notyet { border: 1px dashed var(--axis); border-radius: 8px; padding: 16px 18px; display: grid; gap: 6px; max-width: 72ch; }
.empty { border: 1px dashed var(--axis); border-radius: 8px; padding: 22px; color: var(--muted); max-width: 72ch; } code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; background: var(--plate); padding: 1px 6px; border-radius: 4px; }

[hidden] { display: none !important; }
.menu { position: absolute; top: 46px; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; z-index: 40; display: grid; min-width: 180px; }
.menu a { padding: 9px 12px; border-radius: 6px; } .menu a:hover, .menu a[aria-current="page"] { background: var(--plate); }
button.gridbtn { background: none; border: 0; padding: 0; }
/* animals */
.animalwrap { display: grid; gap: 8px; } canvas.animal { width: 100%; aspect-ratio: 4 / 3; display: block; background: var(--plate); border-radius: 6px; touch-action: pan-y; cursor: grab; }
.zones { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: .76rem; color: var(--muted); }
.zones button { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; font-size: .74rem; color: var(--muted); } .zonefacts { border-left: 2px solid var(--blue); padding: 4px 0 4px 12px; display: grid; gap: 2px; max-width: 72ch; } .zonefacts ul { margin: 4px 0; }
.zones button[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
/* what-if, styles, lab */
.ctl { display: grid; gap: 5px; max-width: 520px; } .ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; font-weight: 500; } input[type=range] { width: 100%; accent-color: var(--blue); min-height: 28px; }
.mini { height: 8px; border-radius: 4px; background: var(--plate); position: relative; min-width: 110px; } .mini i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ink); opacity: .75; }
.mini b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent); } .mini::after { content: ""; position: absolute; top: -3px; bottom: -3px; left: calc(0.2 / 0.67 * 100%); border-left: 1px dashed var(--faint); }
.labtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; } .labtabs button { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 5px 13px; font-size: .88rem; color: var(--muted); } .labtabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.labtabs .sep { width: 1px; background: var(--line); margin: 0 4px; }
pre.out { margin: 0; padding: 16px 18px; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font: .8rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }
.field { display: grid; gap: 4px; font-size: .86rem; } .field input, .field textarea { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); width: 100%; } .field textarea { min-height: 130px; font-family: ui-monospace, Menlo, monospace; font-size: .82rem; }
.fields { display: flex; flex-wrap: wrap; gap: 14px; } .fields .field { width: 160px; }
.fields + .result, .field + .result, .fields + .fields { margin-top: 16px; } .result { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px 16px; display: grid; gap: 4px; max-width: 72ch; } .result .big { font-size: 1.6rem; font-weight: 300; font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  .two, .sources { grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .process { grid-template-columns: minmax(0, 1fr); gap: 18px; } .process::before { left: 17px; right: auto; top: 0; bottom: 0; width: 1px; height: auto; }
  .step { grid-template-columns: 34px minmax(0, 1fr); column-gap: 14px; justify-items: start; } .step .n { grid-row: 1 / span 3; }
  .item { grid-template-columns: minmax(0, 1fr); gap: 4px; }

<script>
(function () {
  "use strict";
  var DATA = __DATA__;
  var W = DATA.wallets, byId = {};
  W.forEach(function (w) { byId[w.id] = w; });
  var app = document.getElementById("app");
  var S = { active: null, page: {}, bio: null, compare: {} };

  // ---- helpers ------------------------------------------------------------------------------------------------------------------------------------------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function short(n) { return String(n).replace(/\s*\([^)]*\)\s*$/, ""); }
  function chip(src, ref) { return src ? '<span class="chip ' + esc(src) + '"' + (ref ? ' title="' + esc(ref) + '"' : "") + ">" + esc(src) + "</span>" : ""; }
  function val(v, src, ref, none) {                                     // a value with its provenance, or the plain statement that the record has none
    if (v == null || v === "") return '<span class="unk">' + esc(none || "not recorded") + "</span>";
    return esc(v) + (src ? " " + chip(src, ref) : "");
  }
  function pct(x) { return Math.floor(100 * x + 0.5) + " %"; }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function yearLabel(y) { return y == null ? "Undated" : String(y); }
  function groups() {
    var m = {};
    W.forEach(function (w) { var k = (w.year == null ? "undated" : w.year) + "|" + w.designer; (m[k] = m[k] || { key: k, year: w.year, designer: w.designer, wallets: [] }).wallets.push(w); });
    var a = Object.keys(m).map(function (k) { return m[k]; });
    a.sort(function (x, y) { return ((x.year == null) - (y.year == null)) || (x.year - y.year) || x.designer.localeCompare(y.designer); });
    return a;
  }
  function sides(g) {                                                  // series alternate left and right of the axis; a single series is split in half
    var sers = [], L = [], R = [];
    g.wallets.forEach(function (w) { if (sers.indexOf(w.series) < 0) sers.push(w.series); });
    if (sers.length > 1) sers.forEach(function (s, i) { var t = i % 2 ? R : L; g.wallets.filter(function (w) { return w.series === s; }).forEach(function (w) { t.push(w); }); });
    else { var h = Math.ceil(g.wallets.length / 2); L = g.wallets.slice(0, h); R = g.wallets.slice(h); }
    return { L: L, R: R };
  }

  // ---- drawings: the wallet's cross-section from its record, and a schematic hide ----------------------------------------------------------------
  function glyph(w, vw, vh) {
    vw = vw || 300; vh = vh || 200;
    if (!w.viewer) return '<span class="small muted" style="padding:14px;text-align:center">No structure drawn for this record</span>';
    var cfg = w.viewer.cfg, m = cfg.models[0], p = {}; m.params.forEach(function (q) { p[q.id] = q.value; });
    var g = WalletGeometry.build(cfg, m, cfg.size, p, {}), T = cfg.T, polys = [], b = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 };
    g.strips.forEach(function (s) {
      var up = [], dn = [];
      s.forEach(function (q) { var nx = -Math.sin(q.phi) * T / 2, ny = Math.cos(q.phi) * T / 2; up.push([q.x + nx, q.y + ny]); dn.push([q.x - nx, q.y - ny]); });
      var poly = up.concat(dn.reverse()); poly.forEach(function (q) { b.x0 = Math.min(b.x0, q[0]); b.x1 = Math.max(b.x1, q[0]); b.y0 = Math.min(b.y0, q[1]); b.y1 = Math.max(b.y1, q[1]); }); polys.push(poly);
    });
    g.blocks.forEach(function (k) { b.x0 = Math.min(b.x0, k.x0); b.x1 = Math.max(b.x1, k.x1); b.y0 = Math.min(b.y0, k.y0); b.y1 = Math.max(b.y1, k.y1); });
    var pad = 26, sc = Math.min((vw - 2 * pad) / (b.x1 - b.x0), (vh - 2 * pad) / (b.y1 - b.y0)), cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
    var X = function (x) { return (vw / 2 + (x - cx) * sc).toFixed(1); }, Y = function (y) { return (vh / 2 - (y - cy) * sc).toFixed(1); };

    return out + "</svg>";
  }
  function plate(w, cls) {

    return '<div class="plate ' + (cls || "") + '">' + glyph(w) + "</div>";
  }
  var HIDE = "M18,58 L30,46 L52,40 L60,18 L74,16 L80,38 L128,36 L140,16 L156,18 L160,44 L190,48 L206,64 L196,84 L160,86 L156,112 L140,114 L128,90 L82,92 L76,114 L60,112 L54,86 L30,80 Z";
  var ZONES = { neck: [18, 56, 0, 130], shoulder: [56, 100, 0, 130], back: [100, 150, 0, 70], belly: [60, 160, 70, 130], butt: [150, 210, 0, 130] };
  var zid = 0;
  function hide(region) {                                              // a schematic hide: shaded only where the record names a region
    var id = "hz" + (++zid), r = (region || "").toLowerCase(), z = Object.keys(ZONES).filter(function (k) { return r.indexOf(k) >= 0; })[0];

    if (z) { var q = ZONES[z]; s += '<rect class="zone" clip-path="url(#' + id + ')" x="' + q[0] + '" y="' + q[2] + '" width="' + (q[1] - q[0]) + '" height="' + (q[3] - q[2]) + '"/>'; }
    s += '<line class="div" x1="56" y1="36" x2="56" y2="92" clip-path="url(#' + id + ')"/><line class="div" x1="100" y1="36" x2="100" y2="92" clip-path="url(#' + id + ')"/><line class="div" x1="150" y1="36" x2="150" y2="92" clip-path="url(#' + id + ')"/>';
    s += '<text class="rl" x="22" y="68">neck</text><text class="rl" x="64" y="68">shoulder</text><text class="rl" x="112" y="62">back</text><text class="rl" x="112" y="82">belly</text><text class="rl" x="164" y="68">butt</text></svg>';
    return s;
  }

  // ---- discover -----------------------------------------------------------------------------------------------------------------------------------------
  function card(w) {
    return '<a class="card" href="#w-' + esc(w.id) + '">' + plate(w) + '<span class="cap"><span class="series">' + esc(w.series || w.designer) + '</span><span class="nm">' + esc(short(w.name)) +
      '</span><span class="st">' + esc(w.status_label) + "</span></span></a>";
  }
  function sideHTML(g, items, cls) {
    var per = 2, key = g.key + cls, pg = S.page[key] || 0, pages = Math.max(1, Math.ceil(items.length / per));

    if (pages > 1) out += '<button class="pager" data-page="' + esc(key) + '" data-dir="-1" aria-label="Previous"' + (pg === 0 ? " disabled" : "") + '>&#8249;</button>';
    out += shown.map(card).join("");
    if (pages > 1) out += '<button class="pager" data-page="' + esc(key) + '" data-dir="1" aria-label="Next"' + (pg === pages - 1 ? " disabled" : "") + ">&#8250;</button>";
    return out + "</div>";
  }
  function discover() {
    var gs = groups();

    if (!S.active || !gs.some(function (g) { return g.key === S.active; })) S.active = gs[0].key;
    var html = '<div class="timeline">';
    gs.forEach(function (g) {
      var on = g.key === S.active, sd = sides(g), und = g.year == null;
      html += '<section class="row' + (on ? " active" : "") + '" data-key="' + esc(g.key) + '">' + (on ? sideHTML(g, sd.L, "left") : "<div></div>") +

        '"></span><span class="who"><b>' + esc(short(g.designer)) + "</b><span>" + esc(yearLabel(g.year).toLowerCase()) + " · " + g.wallets.length + (g.wallets.length === 1 ? " wallet" : " wallets") + "</span></span></button>" +
        (on ? sideHTML(g, sd.R, "right") : "<div></div>");

    html += '<p class="hint">' + (gs.length > 1 ? "Choose a year on the axis, or press the up and down arrow keys. " : "") +

  }
  function bioHTML(g) {
    var w = g.wallets.filter(function (x) { return x.bio_ref; })[0];
    return '<div class="bio"><h3>' + esc(g.designer) + "</h3>" + (w ? '<div class="muted">The corpus holds a biography for this designer (' + esc(w.bio_ref) + "). It is not reproduced here: biographies need the designer's permission.</div>" :
      '<div class="muted">No biography is recorded for this designer. Biographies and portraits need the designer\'s permission, so the archive leaves this empty until a record supplies one.</div>') +
      '<div class="small muted">' + g.wallets.length + " wallet" + (g.wallets.length === 1 ? "" : "s") + " in the archive: " + g.wallets.map(function (x) { return esc(short(x.name)); }).join(", ") + "</div></div>";
  }

  // ---- artists, years, all ------------------------------------------------------------------------------------------------------------------------------
  function artists() {
    var m = {};

    var names = Object.keys(m).sort();
    app.innerHTML = '<div class="page-h"><p class="eyebrow">Artists</p><h2>' + names.length + (names.length === 1 ? " designer" : " designers") + '</h2></div><div class="list">' + names.map(function (n) {
      var ws = m[n], sers = []; ws.forEach(function (w) { if (w.series && sers.indexOf(w.series) < 0) sers.push(w.series); });
      return '<div class="item"><b style="font-weight:500">' + esc(n) + '</b><div class="links">' + ws.map(function (w) { return '<a href="#w-' + esc(w.id) + '">' + esc(short(w.name)) + "</a>"; }).join("") +
        '</div><span class="count">' + ws.length + (ws.length === 1 ? " wallet" : " wallets") + (sers.length ? " · " + esc(sers.join(", ")) : "") + "</span></div>";
    }).join("") + "</div>";
  }
  function years() {
    var m = {};
    W.forEach(function (w) { var k = w.year == null ? "Undated" : String(w.year); (m[k] = m[k] || []).push(w); });
    var ks = Object.keys(m).sort(function (a, b) { return (a === "Undated") - (b === "Undated") || a.localeCompare(b); });
    app.innerHTML = '<div class="page-h"><p class="eyebrow">Years</p><h2>' + (m.Undated && ks.length === 1 ? "No design year is recorded yet" : ks.length + " years") + '</h2></div><div class="list">' + ks.map(function (k) {
      var ws = m[k];
      return '<div class="item"><b style="font-weight:500;color:' + (k === "Undated" ? "var(--amber)" : "inherit") + '">' + esc(k) + '</b><div class="links">' + ws.map(function (w) { return '<a href="#w-' + esc(w.id) + '">' + esc(short(w.name)) + "</a>"; }).join("") +
        '</div><span class="count">' + ws.length + (ws.length === 1 ? " wallet" : " wallets") + "</span></div>";
    }).join("") + "</div>" + (m.Undated ? '<p class="small muted" style="margin-top:18px;max-width:64ch">The retailer records behind these wallets give no design date. A date a shop first listed a wallet is not a design date, so none is filled in.</p>' : "");
  }
  function all() {

  }

  // ---- wallet detail -------------------------------------------------------------------------------------------------------------------------------------
  function srcBar(counts) {

    return '<div class="srcbar" role="img" aria-label="Where the inputs come from">' + order.map(function (k) { return counts[k] ? '<i class="' + k + '" style="width:' + (100 * counts[k] / tot) + '%"></i>' : ""; }).join("") + "</div>" +
      '<div class="srckey">' + order.map(function (k) { return "<span>" + (counts[k] || 0) + " " + k + "</span>"; }).join("") + "</div>";
  }
  function overview(w) {
    var shown = w.facts.map(function (f) { return '<div class="fact"><dt>' + esc(f.label) + "</dt><dd><span>" + val(f.value, f.source, f.ref) + "</span>" + (f.ref && f.value ? '<span class="ref" title="' + esc(f.ref) + '">' + esc(f.ref) + "</span>" : "") + "</dd></div>"; }).join("");
    var hero = w.hero ? "" : '<p class="caption">Cross-section drawn from the record\'s fold structure. The photographs are not shown' + (w.rights_note ? ": research documentation only." : ".") + "</p>";
    var photos = w.photos.length ? "<ul class=\"plain\">" + w.photos.map(function (p) { return "<li>" + esc(p.role) + ' <span class="muted">(' + esc(p.path) + ")</span></li>"; }).join("") + "</ul>" : '<p class="muted small">No photographs are referenced.</p>';
    var cor = w.corpus ? "Wallet-corpus- archive, item " + esc(w.corpus.item) + ", commit " + esc(w.corpus.commit) : "No archive item is named.";

    return '<div class="two"><div>' + plate(w, "hero") + hero + made + '</div><dl class="facts">' + shown + "</dl></div>" +

      '<p class="muted small">No measured card exists for this hide group, so nothing here says how this leather behaves beyond its thickness once that is measured.</p>';
    var tone = h["class"] === "composite" ? "var(--accent)" : h["class"] === "caution" || h["class"] === "unknown" ? "var(--amber)" : "var(--blue)";
    return '<div class="sect"><p class="eyebrow">What kind of hide, and what is known about how it behaves</p><div class="result"><span><b style="font-weight:500">' + (h.group ? esc(h.name) : "Hide group not recognised") + '</b> <span class="pill" style="color:' + tone + '">' + esc(CLASSNAME[h["class"]]) + "</span></span>" +
      '<span class="small muted">' + esc(h.why) + "</span><span class=\"small\"><b style=\"font-weight:500\">Reference cards for this group:</b></span>" + list +
      '<span class="small muted">A card describes the leather in its paper, not this wallet\u2019s leather. No card holds a bending stiffness, a strain at grain crack, a direction ratio or a hide-region effect for any species yet.</span></div></div>';
  }
  function materials(w) {

        (s.ref && known ? '<span class="ref">' + esc(s.ref.length > 90 ? s.ref.slice(0, 88) + "…" : s.ref) + "</span>" : "") + "</div>";
    }).join("") + "</div>";
    var comps = w.components.map(function (c) {

        '<svg class="curve" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0,34 C45,34 55,8 100,8"/></svg><div>' + animalBox(c) + '<div class="tilecap" style="margin-top:8px"><span><b style="font-weight:500">' + (sp ? esc(cap(String(sp))) : '<span class="unk">Species not recorded</span>') + "</b> " + chip(c.species.source, c.species.ref) + "</span>" +

    else if (sel === "strip") body = '<h3>Measure a strip</h3><p class="muted small" style="max-width:72ch">The bending stiffness of a strip, from a cantilever test (Peirce, 41.5 degrees): slide the strip over an edge until its free end has dropped by 41.5 degrees and read the overhang. Weigh and measure the same strip. This gives a bending modulus, the number the simulator most needs and no card holds yet. It is lower than a tensile modulus.</p>' +
      '<div class="fields"><div class="field"><label for="so">Overhang L, mm</label><input id="so" type="number" step="0.5" min="1" data-live="strip" placeholder="e.g. 60"></div><div class="field"><label for="sm">Strip mass, g</label><input id="sm" type="number" step="0.01" min="0" data-live="strip"></div><div class="field"><label for="sl">Strip length, mm</label><input id="sl" type="number" step="0.5" min="1" data-live="strip"></div><div class="field"><label for="sw">Strip width, mm</label><input id="sw" type="number" step="0.5" min="1" data-live="strip"></div><div class="field"><label for="sth">Thickness, mm</label><input id="sth" type="number" step="0.01" min="0.05" data-live="strip"></div></div><div class="result" id="labout"></div>' +
      '<h3 style="margin-top:34px">Thickness exponent</h3><p class="muted small" style="max-width:72ch">Strips of one leather at several thicknesses: one row per strip, <code>thickness mm, rigidity N m</code> (the rigidity above). A homogeneous plate gives 3; fibrous, layered leather may not, and no published value was found. It needs 3 thicknesses spanning a factor of 1.3.</p>' +
      '<div class="field" style="max-width:520px"><label for="te">Thickness and rigidity</label><textarea id="te" data-live="strip" placeholder="0.8, 0.00012\n1.2, 0.00041\n1.6, 0.00095"></textarea></div><div class="result" id="labout2"></div>';
    else if (sel === "rank") body = '<h3>Where it wears first</h3><p class="muted small" style="max-width:70ch">Rank locations by cycles per use times strain to the power m, across a range of m, because no leather-specific exponent is known. One row per location: <code>name, strain %, cycles per use</code>. The rows below are an example of the format, not a wallet.</p>' +
      '<div class="field" style="max-width:520px"><label for="rk">Locations</label><textarea id="rk" data-live="rank">spine, 12, 1\nloop, 21, 1\ncard slot edge, 6, 4</textarea></div><div class="result" id="labout"></div>';
    else if (sel === "fit") body = '<h3>Fit a damage law to your own flex data</h3><p class="muted small" style="max-width:70ch">Least squares on ln N = ln A − m ln ε, from your own flex-to-crack tests: one row per specimen, <code>strain, cycles</code>. It needs at least 3 points that span a factor of 1.5 in strain, and it flags any prediction outside the tested range. There is no example data: none exists for this leather.</p>' +
      '<div class="field" style="max-width:520px"><label for="ft">Strain (as a fraction) and cycles to crack</label><textarea id="ft" data-live="fit" placeholder="0.10, 80000\n0.15, 21000\n0.25, 3500"></textarea></div><div class="fields"><div class="field"><label for="fa">Predict at strain</label><input id="fa" type="number" step="0.01" value="0.12" data-live="fit"></div></div><div class="result" id="labout"></div>';
    else { var r = stored.filter(function (x) { return x.id === sel; })[0]; if (r) body = "<h3>" + esc(r.title) + '</h3><p class="muted small" style="max-width:70ch">' + esc(r.what) + '</p><p class="small muted">Stored output of <code>' + esc(r.command) + "</code>, run in " + r.seconds + " s with walletsim " + esc(DATA.lab.walletsim) + ' (CalculiX). Verbatim; rerun with <code>walletsim lab-run</code>.</p><pre class="out">' + esc(r.output) + "</pre>"; }
    app.innerHTML = '<div class="page-h"><p class="eyebrow">Simulator lab</p><h2>The tools behind the numbers</h2></div>' + (DATA.lab ? "" : '<div class="banner">No stored results. Run <code>walletsim lab-run</code> and rebuild the site to add the solver-based tools.</div>') + tabs + body;
    liveLab();
  }
  function cardsLab() {
    var C = DATA.coverage, ps = C.properties, rows = C.rows.map(function (r) {
      return '<tr><td>' + esc(r.name) + ' <span class="pill" style="' + (r.hide_class === "composite" ? "color:var(--accent)" : r.hide_class === "caution" ? "color:var(--amber)" : "") + '">' + esc(r.hide_class) + "</span></td>" + ps.map(function (p) {
        var c = r.cells[p.key]; return "<td style=\"text-align:center\">" + (c.cards.length ? '<b title="' + esc(c.cards.join(", ")) + '">' + c.cards.length + "</b>" : c.partial.length ? '<span title="tested one direction only" style="color:var(--amber)">\u25d0</span>' : '<span class="muted">\u2013</span>') + "</td>"; }).join("") + "</tr>"; }).join("");
    return '<h3>How far the leather data goes</h3><p class="muted small" style="max-width:72ch">For every hide group in the anatomy library and every property the simulator would need: how many cards hold a measured or published value. A dash means nobody has measured it here. <b style="font-weight:500">' + C.sheet_cells_filled + " of " + C.sheet_cells_total + "</b> cells for the sheet hides have any value. Composite hides (plates or scales) are not simulated at all.</p>" +
      '<div class="scroll"><table><thead><tr><th>Hide group</th>' + ps.map(function (p) { return "<th style=\"text-align:center\">" + esc(p.name) + "</th>"; }).join("") + "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<p class="small muted">\u25d0 = tested in one direction only (no along-versus-across ratio). Only literature values from papers read in full are in the cards; your own strip measurements come from the tool in this Lab and are added as <code>cards/*.yaml</code>.</p>' +
      '<h3 style="margin-top:30px">The cards</h3>' + DATA.cards.map(function (c) {
        return '<div class="result" style="max-width:none;margin-bottom:12px"><span><b style="font-weight:500">' + esc(c.name) + '</b> <span class="muted small">' + esc(c.species) + " \u00b7 " + esc(c.tanning) + " tanned</span></span><span class=\"small muted\">" + esc(c.test) + "</span><span class=\"small\">" + esc(c.cite) + "</span>" +
          '<table><tbody>' + c.rows.map(function (r) { return "<tr><td>" + esc(r.label) + "</td><td>" + esc(r.text) + (r.source ? " " + chip(r.source, r.ref) : "") + '</td><td class="small muted">' + esc(r.ref) + "</td></tr>"; }).join("") + "</tbody></table>" +
          '<span class="small"><b style="font-weight:500">Do not use it for:</b></span><ul class="plain">' + c.not_this.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>"; }).join("");
  }
  function liveLab() {
    var out = document.getElementById("labout"); if (!out) return; var sel = S.lab || "screen";
    if (sel === "strip") {
      var num = function (id) { var e = document.getElementById(id); return e ? parseFloat(e.value) : NaN; }, L = num("so"), m = num("sm"), a = num("sl"), b = num("sw"), t = num("sth");
      if (!(L > 0 && m > 0 && a > 0 && b > 0 && t > 0)) out.innerHTML = '<span class="muted small">Enter all five numbers from the same strip.</span>';
      else {
        var ma = (m / 1000) / ((a / 1000) * (b / 1000)), c = L / 2000, B = ma * 9.80665 * Math.pow(c, 3), Eb = 12 * B / Math.pow(t / 1000, 3) / 1e6;
        out.innerHTML = '<span class="big">' + Eb.toFixed(1) + ' MPa</span><span>effective bending modulus, E<sub>b</sub> = 12 B / t\u00b3</span><span>Flexural rigidity B = ' + B.toExponential(3) + " N m (mass per area " + ma.toFixed(3) + " kg/m\u00b2, bending length " + (L / 2).toFixed(1) + ' mm)</span><span class="small muted">One strip is one specimen. Test several strips (the stiffness of one calfskin lot varied by 29 % between specimens in the only paper with a card) and keep the spread.</span>';
      }
      var o2 = document.getElementById("labout2"), te = document.getElementById("te");
      if (o2 && te) {
        var pts = te.value.split(/\n/).map(function (l) { var p = l.split(","); return [parseFloat(p[0]), parseFloat(p[1])]; }).filter(function (p) { return p[0] > 0 && p[1] > 0; });
        if (pts.length < 3) o2.innerHTML = '<span class="muted small">Enter at least 3 strips.</span>';
        else {
          var tmin = Math.min.apply(null, pts.map(function (p) { return p[0]; })), tmax = Math.max.apply(null, pts.map(function (p) { return p[0]; }));
          if (tmax / tmin < 1.3) o2.innerHTML = '<span class="unk">The thickness range is too narrow to fit an exponent (need max/min of at least 1.3).</span>';
          else { var xs = pts.map(function (p) { return Math.log(p[0]); }), ys = pts.map(function (p) { return Math.log(p[1]); }), n = pts.length, mx = xs.reduce(function (s, v) { return s + v; }) / n, my = ys.reduce(function (s, v) { return s + v; }) / n, sxx = 0, sxy = 0;
            xs.forEach(function (x, i) { sxx += (x - mx) * (x - mx); sxy += (x - mx) * (ys[i] - my); }); var sl = sxy / sxx, ic = my - sl * mx, sse = 0, sst = 0; xs.forEach(function (x, i) { sse += Math.pow(ys[i] - (ic + sl * x), 2); sst += Math.pow(ys[i] - my, 2); });
            o2.innerHTML = '<span class="big">n = ' + sl.toFixed(2) + "</span><span>R\u00b2 = " + (sst > 0 ? 1 - sse / sst : 1).toFixed(3) + " (" + n + " strips). A homogeneous plate gives 3.</span>"; }
        }
      }
      return;
    }
    if (sel === "cards") return;
    if (sel === "screen") {
      var t = +document.getElementById("st").value, R = +document.getElementById("sr").value;
      if (!(t > 0) || !(R >= 0)) { out.innerHTML = '<span class="unk">Enter a thickness above 0 and a radius of 0 or more.</span>'; return; }
      var e = t / (2 * R + t), ratio = R / t, flags = [];
      if (ratio < 1) flags.push("inside radius below 1 × t: the grain relies on the finish to hold, expect cracking (R/t = " + ratio.toFixed(2) + ")"); else if (ratio < 2) flags.push("inside radius below the 2–3 × t rule of thumb (R/t = " + ratio.toFixed(2) + ")");
      if (e >= 0.2) flags.push("outer-fibre strain ≥ 20 % (screening threshold, not a validated failure criterion)");
      out.innerHTML = '<span class="big">' + (100 * e).toFixed(1) + " %</span><span>t = " + t + " mm, R<sub>in</sub> = " + R + " mm (R/t = " + ratio.toFixed(2) + ")</span>" + (flags.length ? "<ul class=\"plain\">" + flags.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>" : "<span>Within the screening rules.</span>");
    } else if (sel === "rank") {
      var rows = document.getElementById("rk").value.split(/\n/).map(function (l) { var p = l.split(","); return { name: (p[0] || "").trim(), eps: parseFloat(p[1]) / 100, n: parseFloat(p[2]) }; }).filter(function (r) { return r.name && r.eps > 0 && r.n > 0; });
      if (rows.length < 2) { out.innerHTML = '<span class="unk">Enter at least two locations.</span>'; return; }
      var ms = [3, 5, 8, 12], rk = ms.map(function (m) { return rows.slice().sort(function (a, b) { return b.n * Math.pow(b.eps, m) - a.n * Math.pow(a.eps, m); }).map(function (r) { return r.name; }); });
      var stable = rk.every(function (r) { return r.join("|") === rk[0].join("|"); });
      out.innerHTML = '<table><thead><tr><th>m</th><th>Order, most damage first</th></tr></thead><tbody>' + ms.map(function (m, i) { return "<tr><td>" + m + "</td><td>" + rk[i].map(esc).join(" › ") + "</td></tr>"; }).join("") + "</tbody></table><span>" +
        (stable ? "The order is the same for every m, so “" + esc(rk[0][0]) + " wears first” holds although m is unknown." : "The order depends on m: the data cannot say which wears first until an exponent is measured.") + "</span>";
    } else if (sel === "fit") {
      var pts = document.getElementById("ft").value.split(/\n/).map(function (l) { var p = l.split(","); return [parseFloat(p[0]), parseFloat(p[1])]; }).filter(function (p) { return p[0] > 0 && p[1] > 0; });
      if (pts.length < 3) { out.innerHTML = '<span class="unk">Enter at least 3 specimens (strain, cycles).</span>'; return; }
      var xs = pts.map(function (p) { return Math.log(p[0]); }), ys = pts.map(function (p) { return Math.log(p[1]); }), n = pts.length, mx = xs.reduce(function (a, b) { return a + b; }) / n, my = ys.reduce(function (a, b) { return a + b; }) / n;
      var smin = Math.min.apply(null, pts.map(function (p) { return p[0]; })), smax = Math.max.apply(null, pts.map(function (p) { return p[0]; }));
      if (smax / smin < 1.5) { out.innerHTML = '<span class="unk">The strain range is too narrow to fit an exponent (need max/min of at least 1.5).</span>'; return; }
      var sxx = 0, sxy = 0; xs.forEach(function (x, i) { sxx += (x - mx) * (x - mx); sxy += (x - mx) * (ys[i] - my); });
      var sl = sxy / sxx, ic = my - sl * mx, sse = 0, sst = 0; xs.forEach(function (x, i) { sse += Math.pow(ys[i] - (ic + sl * x), 2); sst += Math.pow(ys[i] - my, 2); }); var r2 = sst > 0 ? 1 - sse / sst : 1;
      var at = +document.getElementById("fa").value, N = Math.exp(ic) * Math.pow(at, sl), ext = !(smin * 0.8 <= at && at <= smax * 1.25);
      out.innerHTML = '<span class="big">m = ' + (-sl).toFixed(2) + "</span><span>N<sub>crack</sub> = " + Math.exp(ic).toPrecision(4) + " × strain<sup>−" + (-sl).toFixed(2) + "</sup>, R² = " + r2.toFixed(3) + " (" + n + " points, strain " + smin + " to " + smax + ")</span>" +
        (at > 0 ? "<span>At strain " + at + ": " + N.toPrecision(3) + " cycles. " + (ext ? "<b style=\"font-weight:600;color:var(--amber)\">Outside the tested strain range: do not rely on this number.</b>" : "Within the tested range; applies only to the tested leather lot and conditioning.") + "</span>" : "");
    }
  }

  // ---- routing ------------------------------------------------------------------------------------------------------------------------------------------------
  function route() {
    var h = (location.hash || "").replace(/^#/, ""), view = "discover", m;
    document.getElementById("results").hidden = true;
    if ((m = /^w-(.+?)(?:--(materials|behaviour))?$/.exec(h))) { view = "wallet"; wallet(m[1], m[2] || "overview"); }
    else if (h === "artists") { view = "artists"; artists(); } else if (h === "years") { view = "years"; years(); } else if (h === "all") { view = "all"; all(); } else if (h === "lab") { view = "lab"; lab(); } else { discover(); }
    document.getElementById("menu").hidden = true; document.getElementById("gridbtn").setAttribute("aria-expanded", "false");
    document.getElementById("gridbtn").style.color = (view === "all" || view === "lab") ? "var(--fg)" : ""; 
    Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function (a) { if (a.dataset.nav === (view === "wallet" ? "discover" : view)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (view === "wallet") window.scrollTo(0, 0);
    document.title = view === "wallet" && byId[m[1]] ? short(byId[m[1]].name) + " · Wallet Archive" : "Wallet Archive";
  }
  window.addEventListener("hashchange", route);

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-activate],[data-page],[data-bio]");
    if (t) {
      if (t.dataset.activate) { S.active = t.dataset.activate; S.bio = null; discover(); var r = document.querySelector(".row.active"); if (r) r.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
      else if (t.dataset.page) { S.page[t.dataset.page] = Math.max(0, (S.page[t.dataset.page] || 0) + (+t.dataset.dir)); discover(); }
      else if (t.dataset.bio) { S.bio = S.bio === t.dataset.bio ? null : t.dataset.bio; discover(); }
    }
    if (!e.target.closest(".tools")) document.getElementById("results").hidden = true;
  });
  document.getElementById("gridbtn").addEventListener("click", function (e) { e.stopPropagation(); var m = document.getElementById("menu"); m.hidden = !m.hidden; this.setAttribute("aria-expanded", String(!m.hidden)); });
  document.addEventListener("click", function (e) {
    var z = e.target.closest("[data-zone]"), lb = e.target.closest("[data-lab]");
    if (z) { var wrap = z.closest(".animalwrap"), cv = wrap.querySelector("canvas"), on = z.getAttribute("aria-pressed") !== "true";
      Array.prototype.forEach.call(wrap.querySelectorAll("[data-zone]"), function (b) { b.setAttribute("aria-pressed", "false"); }); z.setAttribute("aria-pressed", String(on)); if (cv && cv._setZone) cv._setZone(on ? z.dataset.zone : null);
      var zf = wrap.querySelector(".zonefacts"), zs = wrap.querySelector(".zones"); if (zf) { zf.hidden = !on; zf.innerHTML = on ? zoneFacts(zs && zs.dataset.group, z.dataset.zone) : ""; } }
    if (lb) { S.lab = lb.dataset.lab; lab(); }
    if (!e.target.closest(".tools")) document.getElementById("menu").hidden = true;
  });
  document.addEventListener("input", function (e) {
    var sw = e.target.closest("[data-swap]"), lv = e.target.closest("[data-live]");
    if (sw) { var w = byId[sw.dataset.swap], t = +sw.value; document.getElementById("swaptv").textContent = t.toFixed(2) + " mm"; document.getElementById("swapbody").innerHTML = swapRows(w.swap, t); }
    if (lv) liveLab();
  });
  var wheelAcc = 0, wheelAt = 0;                                      // focused scrolling: the wheel over the timeline moves the active year, one step at a time
  document.addEventListener("wheel", function (e) {
    if (!e.target.closest || !e.target.closest(".timeline") || (location.hash && location.hash !== "#discover")) return;
    var gs = groups(); if (gs.length < 2) return; var now = Date.now(); if (now - wheelAt < 500) { e.preventDefault(); return; }
    wheelAcc += e.deltaY; if (Math.abs(wheelAcc) < 50) return;
    var i = gs.map(function (g) { return g.key; }).indexOf(S.active), j = Math.max(0, Math.min(gs.length - 1, i + (wheelAcc > 0 ? 1 : -1))); wheelAcc = 0;
    if (j !== i) { e.preventDefault(); wheelAt = now; S.active = gs[j].key; S.bio = null; discover(); }
  }, { passive: false });
  document.addEventListener("change", function (e) { var s = e.target.closest("[data-compare]"); if (s) { S.compare[s.dataset.compare] = s.value; route(); } });
  document.addEventListener("keydown", function (e) {
    if (!/^(ArrowUp|ArrowDown)$/.test(e.key) || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || document.querySelector(".row") == null) return;
    var gs = groups(), i = gs.map(function (g) { return g.key; }).indexOf(S.active), j = Math.max(0, Math.min(gs.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    if (j !== i && (location.hash === "" || location.hash === "#discover")) { e.preventDefault(); S.active = gs[j].key; S.bio = null; discover(); }
  });

  // ---- search -----------------------------------------------------------------------------------------------------------------------------------------------------
  var q = document.getElementById("q"), res = document.getElementById("results");
  function haystack(w) {
    var bits = [w.name, w.designer, w.series, w.status_label, yearLabel(w.year)];
    w.facts.forEach(function (f) { if (/^(Species|Tanning|Finishing)$/.test(f.label) && f.value) bits.push(f.value); });
    return bits.join(" ").toLowerCase();
  }
  q.addEventListener("input", function () {
    var s = q.value.trim().toLowerCase(); if (!s) { res.hidden = true; return; }
    var terms = s.split(/\s+/), hits = W.filter(function (w) { var hs = haystack(w); return terms.every(function (t) { return hs.indexOf(t) >= 0; }); });
    res.innerHTML = hits.length ? hits.map(function (w) { return '<a href="#w-' + esc(w.id) + '"><b style="font-weight:500">' + esc(short(w.name)) + '</b><span class="small muted">' + esc(w.designer) + (w.series ? " · " + esc(w.series) : "") + "</span></a>"; }).join("") :
      '<div class="none">Nothing in the archive matches &ldquo;' + esc(q.value.trim()) + "&rdquo;.</div>";
    res.hidden = false;
  });
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") { var a = res.querySelector("a"); if (a) { location.hash = a.getAttribute("href"); q.value = ""; res.hidden = true; } } if (e.key === "Escape") { res.hidden = true; } });
  res.addEventListener("click", function () { q.value = ""; res.hidden = true; });

  var hd = DATA.hidden_designs && DATA.hidden_designs.length ? " " + DATA.hidden_designs.length + " generated test design" + (DATA.hidden_designs.length === 1 ? " is" : "s are") + " not shown." : "";
  document.getElementById("foot").innerHTML = "<span>" + W.length + " wallet record" + (W.length === 1 ? "" : "s") + ", built by walletsim " + esc(DATA.version) + "." + esc(hd) + "</span><span>Every figure shows where it came from: measured, reported, inferred, design, literature or assumed. Nothing is shown that a record does not state.</span><span>Animal models: " + esc(DATA.animals.title) + " by " + esc(DATA.animals.author) + ", " + esc(DATA.animals.license) + " (cow, pig, horse, sheep). No free goat model has been found, so goats show the flat schematic.</span>";
  window.__archive = { mountAnimal: mountAnimal, data: DATA, route: route, state: S, groups: groups, setData: function (d) { W = d.wallets; byId = {}; W.forEach(function (w) { byId[w.id] = w; }); DATA = d; S.active = null; route(); } };
  route();
})();
</script>
