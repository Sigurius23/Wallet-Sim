[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walletsim"
version = "0.1.0"
description = "Digital twins of leather wallets with fold and wear simulation"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
capture = ["opencv-python-headless", "shapely", "ezdxf", "trimesh"]
viz = ["matplotlib", "pyvista"]
dev = ["pytest"]

[project.scripts]
walletsim = "walletsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fem: needs CalculiX (ccx) on PATH"]
