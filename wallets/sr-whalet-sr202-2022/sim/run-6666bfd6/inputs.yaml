  series: WHALET
  bio_ref: "designers/sruli_recht/README.md in the Wallet-corpus- archive (not reproduced here)"
  hero_image: null
  rights: {photos: "Sruli Recht / Atelier Sruli Recht, photography Marinó Thorlacius; research documentation only, not cleared for reuse", bio: "not cleared for reuse"}
leather:
  - id: shell
    role: the single piece of leather the whole wallet is cut and folded from
    thickness_mm: {value: 1.0, source: assumed, ref: "NOT STATED by the maker. A one-piece card wallet 10 mm deep closed; 1.0 mm is a stand-in for vegetable-tanned horse skin, not a reading"}
    species: {value: horse (equine), source: reported, ref: "maker's page (corpus SRW11): 'It is made from horse skin'; 'regional vegetable tanned horse skin'"}
    hide_region: {value: unknown, source: assumed}
    windows:
      beamhouse: unknown
      tanning: {value: vegetable, source: reported, ref: "maker's page: the 2022 version is made 'from regional vegetable tanned horse skin' (the 2010 original was chromium-tanned Icelandic horse skin)"}
      post_tanning: unknown
      finishing: {value: "Black Sable (the one colour offered)", source: reported, ref: "maker's page: 'Black Sable, dark as Icelandic winter'; how it is dyed or finished is not stated"}
    edge: {value: unknown, source: assumed}
    material:
      youngs_modulus_mpa: {value: 72, source: assumed, cv: 0.29, ref: "placeholder: the tensile value measured for 1.2 mm CALFskin (Mihai et al., Materials 2022, 15(15):5107); no horse-skin value is on record. The maker says the leather 'is designed to stretch to fit' cards, which this elastic model does not capture"}
      poisson: {value: 0.3, source: assumed}
