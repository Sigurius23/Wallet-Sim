    crosses_fold: unknown
    holes: {value: 0, source: assumed, note: "number of holes not recorded"}
pockets:
  - {id: card slots, card_capacity: 5, note: "maker: 'designed to hold 4-5 cards per slot'; the leather is eased by sliding in one card at a time"}
  - {id: back slot, card_capacity: 0, note: "maker: 'the back section is a larger third slot, spaced for fitting bills, either folded or open'; no coin section"}
sizes:
