contents:
  cards: {value: 0, source: assumed, note: "the 10 mm depth is the maker's figure; whether it was taken empty is not stated"}
  card_mm: {value: 0.76, source: literature, ref: ISO/IEC 7810 ID-1 nominal thickness}
  extra_mm: {value: 0.0, source: assumed}
construction:
  type: custom
  grain: out
  layup: plain
  closed_thickness_mm: {value: 10.0, source: reported, ref: "maker's page (corpus SRW11): 'Dimensions of WHALET - 85 mm x 100 mm x 10 mm'. Not checked, and not said whether it is empty or loaded"}
  # What the maker says: 'a single piece of leather, laser cut, folded into shape, formed with steam vapor, and hand tethered with black oxidized rivets to create a card wallet'.
  # What the photographs show (corpus images 034 to 037, enlarged), with my confidence:
  #   - a closed landscape wallet 100 x 85 mm with a flap that has rounded corners and a hole for a rivet or snap                moderate
  #   - the open wallet (035): the flap, a stepped set of three rounded card panels, and a larger bottom panel with a rivet/snap   moderate
  #   - the low view (034): a hairpin wrap at one short end and stepped layer edges at the other                                   low
  #   - NO scale and no edge-on view that counts the layers: the 10 mm depth is the maker's figure, the layer count is not known
  # Which end is the flap hinge, and which folds wrap the pack, is my reading of one oblique photograph. Both end folds are given the same stack, with a range.
  # The rivets, the card panels and the flap's closure are not modelled.
  folds_modelled:
    - name: flap hinge (right end)
      stack_from_closed_thickness: {shells: 2, low: 4.0, ref: "the flap closes over everything but the outer layers; the lower bound 4 mm is assumed (an empty wallet with slack panels is thinner than the stated depth)"}
      sense: out
    - name: left end fold
      stack_from_closed_thickness: {shells: 2, low: 4.0, ref: "the hairpin wrap at the other short end (low view, image 034); assumed to wrap the same pack"}
      sense: out
panels:
  - {id: sheet, leather: shell, outline: null, grain_direction_deg: {value: 0, source: assumed}}
folds:
  - {id: flap hinge, panel: sheet, rest_angle_deg: 180, skived: {value: unknown, source: assumed}}
  - {id: left end fold, panel: sheet, rest_angle_deg: 180, skived: {value: unknown, source: assumed}}
seams:
