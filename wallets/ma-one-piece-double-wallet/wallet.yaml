      poisson: {value: 0.3, source: assumed}
components: []
process_steps: []
contents:
  cards: {value: 0, source: assumed, note: "photographed empty"}
  card_mm: {value: 0.76, source: literature, ref: ISO/IEC 7810 ID-1 nominal thickness}
  extra_mm: {value: 0.0, source: assumed}
construction:
  type: custom
  grain: out
  layup: plain
  # What the edge-on photographs show (corpus images 017 and 012, enlarged), with my confidence:
  #   - the outer sheet wraps one end (the spine) and continues as the bottom panel                                     moderate
  #   - FOUR thin inner leaves, each with a thread tie near the spine end (four ties at that end)                        moderate
  #   - two tied rounded loops at the opposite end, one over the other (two ties at that end)                            moderate
  #   - the same one-sheet accordion (Z-chain) as the One Piece Wallet, with four leaves instead of three: top -> loop 1 ->
  #     leaf A -> left fold 1 -> leaf B -> loop 2 -> leaf C -> left fold 2 -> leaf D (free end). Loops turn the same way
  #     (grain outside); the left folds turn the other way (grain inside)                                               inferred layout
  #   - opened (images 013, 014) it shows a row of fan-shaped pockets, which a cross-section cannot represent; not modelled
  #   - NO scale in any photograph: every radius and thickness below is an inference or an assumption
  folds_modelled:
    - name: spine
      # DERIVED from the loops, as for the One Piece Wallet: leaves x t + (leaves + 1) x gap = 4 x 1.0 + 5 x 1.0 = 9.0 mm at the recorded loop void.
      stack_from_loops: {leaves: {value: 4, source: inferred, ref: "four inner leaves, each with a thread tie, in the edge-on photographs"}, gap_from: "loop 1 (end opposite the spine)"}
      sense: out
    - name: loop 1 (end opposite the spine)
      stack_mm: {value: 1.0, low: 0.5, high: 4.0, source: assumed, ref: "the void inside the loop looks about one leather thickness across in the enlarged photograph (the same reading as the One Piece Wallet); the upper bound is a pocket holding about 5 cards"}
      sense: out
    - name: left fold 1 (spine end)
      stack_mm: {value: 1.0, low: 0.5, high: 4.0, source: assumed, ref: "the hairpin between leaf A and leaf B at the spine end; assumed to have the same void as the loops because the layers lie one gap apart. It turns the other way, so the grain is inside"}
      sense: in
    - name: loop 2 (end opposite the spine)
      stack_mm: {value: 1.0, low: 0.5, high: 4.0, source: assumed, ref: "as loop 1; the same direction as loop 1, so the grain is outside"}
      sense: out
    - name: left fold 2 (spine end)
      stack_mm: {value: 1.0, low: 0.5, high: 4.0, source: assumed, ref: "as left fold 1: the hairpin between leaf C and leaf D"}
      sense: in
panels:
  - {id: sheet, leather: shell, outline: null, grain_direction_deg: {value: 0, source: assumed}}
folds:
  - {id: spine, panel: sheet, rest_angle_deg: 180, skived: {value: unknown, source: assumed}}
  - {id: loops, panel: sheet, rest_angle_deg: 180, skived: {value: unknown, source: assumed}}
  - {id: left folds, panel: sheet, rest_angle_deg: 180, skived: {value: unknown, source: assumed}}
seams:
  - id: thread ties
    note: "thread ties through the loops and through the leaf ends near the spine (corpus images 017, 012)"
    crosses_fold: [loop 1 (end opposite the spine), left fold 1 (spine end), loop 2 (end opposite the spine), left fold 2 (spine end)]
    holes: {value: 0, source: assumed, note: "number of holes not visible"}
