    material:
      youngs_modulus_mpa: {value: 72, source: assumed, cv: 0.29, ref: "placeholder: the tensile value measured for 1.2 mm calfskin (Mihai et al., Materials 2022, 15(15):5107); this leather has not been tested"}
      poisson: {value: 0.3, source: assumed}
components: []
process_steps: []
contents:
  cards: {value: 0, source: assumed, note: "photographed empty"}
  card_mm: {value: 0.76, source: literature, ref: ISO/IEC 7810 ID-1 nominal thickness}
  extra_mm: {value: 0.0, source: assumed}
construction:
  type: custom
  grain: out                  # assumed: which face of the sheet is the grain is not visible in the photographs
  layup: plain
  # What the photographs show (edge-on closed wallet, corpus image 005 and 008, enlarged), with my confidence:
  #   - the outer sheet wraps one end ("the spine") and continues as the bottom panel                       moderate
  #   - three thin inner leaves lie inside the wrap, each with a thread tie near the spine end               moderate
  #   - at the opposite end, two tight hairpin folds ("loops"), one over the other, each pinned by a thread tie  moderate
  #   - the leaves are joined into one accordion (Z-chain): top -> loop 1 -> leaf A -> left fold -> leaf B -> loop 2 -> leaf C (free end).
  #     Both loops turn the same way (grain outside); the left fold turns the other way (grain inside)             inferred layout
  #   - NO scale in any photograph: every radius and thickness below is an inference or an assumption          -
  folds_modelled:
    - name: spine
      # DERIVED, not independent. In the one-sheet accordion the layers lie one gap apart and the gap is the void inside a loop, so the spine wraps
      # leaves x t + (leaves + 1) x gap = 3 x 1.0 + 4 x 1.0 = 7.0 mm at the recorded loop. The range follows the loops' range (5.0 to 19.0 mm), which already
      # includes whatever the pockets hold. This replaces an earlier independent value of 3.0 mm (3 leaves touching), which the layout contradicts.
      stack_from_loops: {leaves: {value: 3, source: inferred, ref: "three inner leaves seen in the edge-on photographs"}, gap_from: "loop 1 (end opposite the spine)"}
      sense: out
    - name: loop 1 (end opposite the spine)
      stack_mm: {value: 1.0, low: 0.5, high: 4.0, source: assumed, ref: "the void inside the loop looks about one leather thickness across in the enlarged photograph; the upper bound is a pocket holding about 5 cards"}
      sense: out
    - name: left fold (spine end)
      stack_mm: {value: 1.0, low: 0.5, high: 4.0, source: assumed, ref: "the hairpin between leaf A and leaf B, at the spine end; assumed to have the same void as the loops, since the layers lie one gap apart. It turns the other way from the loops, so the grain is on the inside"}
      sense: in
    - name: loop 2 (end opposite the spine)
      stack_mm: {value: 1.0, low: 0.5, high: 4.0, source: assumed, ref: "as loop 1; it turns the same way as loop 1 (both are on the same side of the chain), so the grain is on the outside"}
      sense: out
panels:
  - {id: sheet, leather: shell, outline: null, grain_direction_deg: {value: 0, source: assumed}}
folds:
  - id: spine
    panel: sheet
    rest_angle_deg: 180
    skived: {value: unknown, source: assumed}
  - id: left fold
    panel: sheet
    rest_angle_deg: 180
    skived: {value: unknown, source: assumed}
  - id: loops
    panel: sheet
    rest_angle_deg: 180
    skived: {value: unknown, source: assumed}
seams:
  - id: thread ties
    note: "thread ties through the two loops and through the ends of the three inner leaves near the spine (corpus images 005, 008)"
    crosses_fold: [loop 1 (end opposite the spine), left fold (spine end), loop 2 (end opposite the spine)]
    holes: {value: 0, source: assumed, note: "number of holes not visible"}
pockets: []
