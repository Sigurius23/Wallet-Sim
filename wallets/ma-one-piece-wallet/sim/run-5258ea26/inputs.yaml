    role: the single sheet the whole wallet is folded from
    thickness_mm: {value: 1.0, source: reported, ref: "retailer (Lucentement, corpus MAP03): 'one piece of 1 mm thick calf leather'"}
    species: {value: bovine (calf), source: reported, ref: "composition: calf leather 100 %"}
    hide_region: {value: unknown, source: assumed}
